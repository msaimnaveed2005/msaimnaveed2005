name: profile refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Regenerate portrait
        run: |
          python ascii.py
          python ascii_to_svg.py

      - name: Commit updates if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ascii.txt output/ascii.svg
          if git diff --cached --quiet; then
            echo "No portrait changes to commit."
            exit 0
          fi
          git commit -m "profile: refresh portrait"
          git push
